name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # tsc alone can't see LayoutProps/PageProps etc. — those come from
      # .next/types, which `next build` normally generates as a side effect.
      # A local checkout usually already has a stale .next/ lying around
      # from a previous build, which hides this; a clean CI checkout doesn't.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
